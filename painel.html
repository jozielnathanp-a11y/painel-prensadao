<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prensadão — Painel</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#c8102e"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: #c8102e;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
    }
    .header-logo {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 2rem;
      letter-spacing: 3px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .header-hora {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    /* ── MAIN: 3 colunas ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── COLUNA AGUARDANDO (esquerda 22%) ── */
    .col-aguardando {
      flex: 0 0 22%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #111;
      border-right: 2px solid #222;
    }

    /* ── COLUNA RETIRAR (centro 33%) ── */
    .col-retirar {
      flex: 0 0 33%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0d0000;
      border-right: 2px solid #222;
    }

    /* ── COLUNA MÍDIA (direita 45%) ── */
    .col-midia {
      flex: 0 0 45%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    /* ── TÍTULOS DAS COLUNAS ── */
    .col-titulo {
      padding: 14px 20px 12px;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #222;
      flex-shrink: 0;
    }
    .col-aguardando .col-titulo {
      color: #f5a623;
      background: #111;
    }
    .col-aguardando .col-titulo::before {
      content: '';
      display: block;
      width: 5px; height: 24px;
      background: #f5a623;
      border-radius: 3px;
    }
    .col-retirar .col-titulo {
      color: #fff;
      background: #c8102e;
      font-size: 1.8rem;
    }
    .col-retirar .col-titulo::before {
      content: '';
      display: block;
      width: 5px; height: 24px;
      background: rgba(255,255,255,0.5);
      border-radius: 3px;
    }
    .midia-titulo { display: none; }

    /* ── LISTAS ── */
    .col-lista {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .col-lista::-webkit-scrollbar { width: 3px; }
    .col-lista::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* ── CARDS AGUARDANDO ── */
    .card-aguardando {
      background: #1a1a1a;
      border: 1.5px solid #2a2a2a;
      border-left: 5px solid #f5a623;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .card-aguardando .num {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 2.4rem;
      color: #f5a623;
      line-height: 1;
      min-width: 64px;
      text-align: center;
    }
    .card-aguardando .label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
    }
    .card-aguardando .nome {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ddd;
    }

    /* ── CARDS RETIRAR ── */
    .card-retirar {
      background: #1a0000;
      border: 2px solid #c8102e;
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .card-retirar.novo { animation: pulsar 0.4s ease 4; }
    @keyframes pulsar {
      0%,100% { transform:scale(1); border-color:#c8102e; }
      50% { transform:scale(1.025); border-color:#ff4d6d; box-shadow:0 0 24px rgba(200,16,46,0.5); }
    }
    .card-retirar .num {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 3.6rem;
      color: #fff;
      line-height: 1;
      min-width: 90px;
      text-align: center;
    }
    .card-retirar .label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c8102e;
    }
    .card-retirar .nome {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
    }
    .card-retirar .badge {
      margin-left: auto;
      background: #c8102e;
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .vazio {
      color: #333;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 40px;
      font-style: italic;
      letter-spacing: 1px;
    }

    /* ── ÁREA DE MÍDIA ── */
    .midia-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .midia-area video,
    .midia-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .midia-area img { display: none; }
    .sem-midia {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #222;
      font-size: 0.75rem;
      text-align: center;
      padding: 16px;
    }
    .sem-midia span { font-size: 2rem; }

    /* ── UPLOAD — escondido, aparece ao passar o mouse ── */
    .upload-area {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 10px;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .col-midia:hover .upload-area { opacity: 1; }
    .upload-btns {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }
    .btn-upload {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: rgba(255,255,255,0.5);
      padding: 6px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.7rem;
      text-align: center;
    }
    .btn-upload:hover { background: #c8102e; color: #fff; border-color: #c8102e; }
    #upload-status {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      text-align: center;
      min-height: 14px;
    }
    #lista-midias {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 80px;
      overflow-y: auto;
      margin-bottom: 4px;
    }
    .midia-item {
      background: #1a1a1a;
      border-radius: 3px;
      padding: 3px 8px;
      font-size: 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: rgba(255,255,255,0.45);
    }
    .midia-item button {
      background: none; border: none;
      color: #c8102e; cursor: pointer; font-size: 0.75rem;
    }
    .midia-contador {
      font-size: 0.6rem;
      color: #444;
      text-align: center;
      margin-bottom: 2px;
    }

    /* ── OVERLAY ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.97);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }
    #overlay.ativo { display: flex; }
    .overlay-top {
      font-size: 1vw;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 8px;
    }
    .overlay-num {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 22vw;
      color: #c8102e;
      line-height: 0.85;
    }
    .overlay-nome {
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 6vw;
      color: #fff;
      margin-top: 10px;
      letter-spacing: 4px;
    }
    .overlay-sub {
      font-size: 1.2vw;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-top: 20px;
    }
    .overlay-barra {
      margin-top: 28px;
      width: 200px; height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .overlay-progresso {
      height: 100%;
      background: #c8102e;
      border-radius: 2px;
      animation: progresso 5s linear forwards;
    }
    @keyframes progresso { from{width:100%} to{width:0%} }
  </style>
</head>
<body>

  <header>
    <div class="header-logo">🍔 PRENSADÃO</div>
    <div class="header-center">Centro — Painel de Pedidos</div>
    <div class="header-hora" id="hora">00:00</div>
  </header>

  <div class="main">

    <!-- Esquerda: Aguardando -->
    <div class="col-aguardando">
      <div class="col-titulo">⏳ Aguardando</div>
      <div class="col-lista" id="lista-preparo">
        <div class="vazio">Nenhum pedido em preparo</div>
      </div>
    </div>

    <!-- Centro: Retirar Aqui -->
    <div class="col-retirar">
      <div class="col-titulo">🔔 Retire Aqui!</div>
      <div class="col-lista" id="lista-retirar">
        <div class="vazio">Nenhum pedido pronto ainda</div>
      </div>
    </div>

    <!-- Direita: Mídia (foto/vídeo) -->
    <div class="col-midia">
      <div class="midia-titulo">Promoções</div>
      <div class="midia-area" id="midia-area">
        <div class="sem-midia" id="sem-midia">
          <span>📺</span>
          <div>Adicione fotos<br>ou vídeos abaixo</div>
        </div>
        <video id="midia-video" muted playsinline style="display:none"></video>
        <img id="midia-img" style="display:none" alt="promoção"/>
      </div>
      <div class="upload-area">
        <div class="midia-contador" id="midia-contador"></div>
        <div id="lista-midias"></div>
        <div class="upload-btns">
          <label class="btn-upload" for="input-video">＋ Vídeo</label>
          <input type="file" id="input-video" accept="video/mp4,video/webm" style="display:none" onchange="uploadMidia(this,'video')">
          <label class="btn-upload" for="input-foto">＋ Foto</label>
          <input type="file" id="input-foto" accept="image/jpeg,image/png,image/gif" style="display:none" onchange="uploadMidia(this,'foto')">
        </div>
        <div id="upload-status"></div>
      </div>
    </div>

  </div>

  <!-- Overlay chamada -->
  <div id="overlay">
    <div class="overlay-top">Pedido Pronto</div>
    <div class="overlay-num" id="overlay-num">—</div>
    <div class="overlay-nome" id="overlay-nome"></div>
    <div class="overlay-sub">Retire no balcão · Obrigado!</div>
    <div class="overlay-barra"><div class="overlay-progresso" id="overlay-prog"></div></div>
  </div>

  <script>
    // ── Relógio ──
    function tick() {
      document.getElementById('hora').textContent =
        new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    }
    setInterval(tick, 1000); tick();

    // ── Upload mídia ──
    const MAX_MIDIAS = 4;

    function uploadMidia(input, tipo) {
      const file = input.files[0];
      if (!file) return;
      const status = document.getElementById('upload-status');

      // Verifica limite
      if (midias.length >= MAX_MIDIAS) {
        status.textContent = '⚠️ Máx ' + MAX_MIDIAS + ' mídias!';
        setTimeout(()=>status.textContent='', 3000);
        input.value = '';
        return;
      }

      status.textContent = '⏳ Enviando...';
      const form = new FormData();
      form.append(tipo === 'video' ? 'video' : 'foto', file);
      const endpoint = tipo === 'video' ? '/upload-video' : '/upload-foto';

      fetch(endpoint, { method:'POST', body:form })
        .then(r=>r.json())
        .then(d=>{
          if (d.ok) {
            const aviso = d.sizeMB > 30 ? ` ⚠️ ${d.sizeMB}MB — pode travar! Use vídeo menor.` : '';
            status.textContent = '✅ ' + d.filename + aviso;
            carregarMidias();
          } else {
            status.textContent = '❌ ' + (d.erro || 'Erro');
          }
          setTimeout(()=>status.textContent='', 5000);
        })
        .catch(()=>{ status.textContent='❌ Falhou'; });
      input.value = '';
    }

    function deletarMidia(filename, tipo) {
      if (!confirm('Remover ' + filename + '?')) return;
      const endpoint = tipo === 'video' ? '/deletar-video' : '/deletar-foto';
      fetch(endpoint, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({filename})
      }).then(()=>carregarMidias());
    }

    // ── Player de mídias ──
    let midias = []; // [{url, tipo}]
    let midiaIdx = 0;
    let midiaTimer = null;

    const videoEl = document.getElementById('midia-video');
    const imgEl   = document.getElementById('midia-img');
    const semMidia = document.getElementById('sem-midia');

    videoEl.onended = () => proxMidia();
    videoEl.onerror = () => { setTimeout(proxMidia, 1000); };

    function proxMidia() {
      if (!midias.length) return;
      midiaIdx = (midiaIdx + 1) % midias.length;
      tocarMidia(midiaIdx);
    }

    function tocarMidia(idx) {
      if (!midias.length) {
        semMidia.style.display='flex'; videoEl.style.display='none'; imgEl.style.display='none';
        return;
      }
      clearTimeout(midiaTimer);
      semMidia.style.display = 'none';
      const m = midias[idx];

      if (m.tipo === 'video') {
        imgEl.style.display = 'none';
        videoEl.style.display = 'block';
        // Para TV Box: carrega só o necessário
        videoEl.preload = 'none';
        videoEl.src = m.url;
        videoEl.load();
        videoEl.play().catch(()=>document.addEventListener('click',()=>videoEl.play(),{once:true}));
      } else {
        // Para foto: pausa e limpa o vídeo para liberar memória
        videoEl.pause();
        videoEl.src = '';
        videoEl.style.display = 'none';
        imgEl.style.display = 'block';
        imgEl.src = m.url;
        midiaTimer = setTimeout(proxMidia, 8000);
      }
    }

    function atualizarListaMidias(lista) {
      const el = document.getElementById('lista-midias');
      const contador = document.getElementById('midia-contador');
      contador.textContent = `${lista.length}/${MAX_MIDIAS} mídias`;
      el.innerHTML = lista.map(m => {
        const nome = m.url.split('/').pop();
        const icone = m.tipo === 'video' ? '🎬' : '🖼️';
        return `<div class="midia-item">
          <span>${icone} ${nome}</span>
          <button onclick="deletarMidia('${nome}','${m.tipo}')">✕</button>
        </div>`;
      }).join('');
    }

    function carregarMidias() {
      Promise.all([
        fetch('/videos').then(r=>r.json()).catch(()=>[]),
        fetch('/fotos').then(r=>r.json()).catch(()=>[])
      ]).then(([videos, fotos]) => {
        const novas = [
          ...videos.map(u=>({url:u, tipo:'video'})),
          ...fotos.map(u=>({url:u, tipo:'foto'}))
        ];
        const mudou = JSON.stringify(novas) !== JSON.stringify(midias);
        if (mudou) {
          midias = novas;
          atualizarListaMidias(novas);
          if (novas.length > 0) {
            const idx = midiaIdx % novas.length;
            // Só inicia se não está tocando nada
            if (videoEl.paused && imgEl.style.display === 'none' || !novas.length) {
              tocarMidia(idx);
            }
          } else {
            semMidia.style.display='flex'; videoEl.style.display='none'; imgEl.style.display='none';
          }
        }
      });
    }
    carregarMidias();
    setInterval(carregarMidias, 30000);

    // ── Som campainha ──
    function tocarSom() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t = ctx.currentTime;
        [[880,0.6,0.5],[1760,0.35,0.35],[2637,0.2,0.25]].forEach(([f,v,d]) => {
          [0, 0.28, 0.56].forEach(offset => {
            const osc=ctx.createOscillator(), gain=ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type='square'; osc.frequency.value=f;
            gain.gain.setValueAtTime(0,t+offset);
            gain.gain.linearRampToValueAtTime(v,t+offset+0.01);
            gain.gain.exponentialRampToValueAtTime(0.001,t+offset+d);
            osc.start(t+offset); osc.stop(t+offset+d+0.05);
          });
        });
      } catch(e) {}
    }

    // ── Estado ──
    let estado = { prontos:[], retirados:[] };

    function renderizar() {
      const lp = document.getElementById('lista-preparo');
      lp.innerHTML = estado.prontos.length === 0
        ? '<div class="vazio">Nenhum pedido em preparo</div>'
        : estado.prontos.map(p=>`
            <div class="card-aguardando">
              <div class="num">#${p.numero||'—'}</div>
              <div>
                <div class="label">Pedido</div>
                ${p.nome && p.nome!=='Cliente'?`<div class="nome">${p.nome}</div>`:''}
              </div>
            </div>`).join('');

      const lr = document.getElementById('lista-retirar');
      lr.innerHTML = estado.retirados.length === 0
        ? '<div class="vazio">Nenhum pedido pronto ainda</div>'
        : estado.retirados.map(p=>`
            <div class="card-retirar" id="card-r-${p.id}">
              <div class="num">#${p.numero||'—'}</div>
              <div>
                <div class="label">Retire Aqui!</div>
                ${p.nome && p.nome!=='Cliente'?`<div class="nome">${p.nome}</div>`:''}
              </div>
              <div class="badge">🔔</div>
            </div>`).join('');
    }

    // ── Overlay ──
    let fila = [], alertaAtivo = false;

    function mostrarAlerta(p) {
      fila.push(p);
      if (!alertaAtivo) processarFila();
    }

    function processarFila() {
      if (!fila.length) { alertaAtivo=false; return; }
      alertaAtivo=true;
      const p = fila.shift();
      document.getElementById('overlay-num').textContent = '#'+(p.numero||'—');
      document.getElementById('overlay-nome').textContent = (p.nome&&p.nome!=='Cliente')?p.nome:'';
      const prog = document.getElementById('overlay-prog');
      prog.style.animation='none'; prog.offsetHeight; prog.style.animation='';
      document.getElementById('overlay').classList.add('ativo');
      tocarSom();
      setTimeout(()=>{
        document.getElementById('overlay').classList.remove('ativo');
        setTimeout(processarFila, 400);
      }, 5000);
    }

    // ── Polling 5s ──
    let ultimoEstado = '';
    function buscarEstado() {
      fetch('/pedidos').then(r=>r.json()).then(data=>{
        const novo = JSON.stringify(data);
        if (novo !== ultimoEstado) {
          const idsAntes = new Set((estado.retirados||[]).map(p=>p.id));
          estado = data;
          (data.retirados||[]).filter(p=>!idsAntes.has(p.id)).forEach(p=>{
            mostrarAlerta(p);
            setTimeout(()=>{
              const c=document.getElementById(`card-r-${p.id}`);
              if(c){c.classList.add('novo');setTimeout(()=>c.classList.remove('novo'),2000);}
            },200);
          });
          ultimoEstado = novo;
          renderizar();
        }
      }).catch(()=>{});
    }
    buscarEstado();
    setInterval(buscarEstado, 5000);
  </script>
</body>
</html>
